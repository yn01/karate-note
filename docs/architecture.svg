<svg xmlns="http://www.w3.org/2000/svg" width="880" height="636" viewBox="0 0 880 636" font-family="'Hiragino Sans', 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif">
  <!-- 空手ノートのしくみの図。docs/architecture.png はこの SVG を画像にしたもの -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868e96"/>
    </marker>
  </defs>

  <!-- いちばん上：アプリ -->
  <rect x="200" y="18" width="480" height="56" rx="10" fill="#f8f9fa" stroke="#343a40" stroke-width="1.5"/>
  <text x="440" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#212529">空手ノート</text>
  <text x="440" y="61" text-anchor="middle" font-size="10" fill="#495057">紙の空手ノートを、道場生・保護者・先生でつなぐ（ログインなしのデモ）</text>

  <!-- 矢印：アプリ → 3つの立場 -->
  <line x1="300" y1="74" x2="162" y2="127" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="440" y1="74" x2="440" y2="127" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="74" x2="718" y2="127" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="214" y="92" text-anchor="end" font-size="9" fill="#868e96">ノートを撮って、ふりかえる</text>
  <text x="452" y="102" text-anchor="start" font-size="9" fill="#868e96">お便りを読む</text>
  <text x="666" y="92" text-anchor="start" font-size="9" fill="#868e96">確かめて、承認する</text>

  <!-- 道場生 -->
  <rect x="30" y="130" width="260" height="238" rx="12" fill="#e6fcf5" stroke="#099268" stroke-width="1.5"/>
  <text x="160" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#087f5b">道場生</text>
  <text x="160" y="170" text-anchor="middle" font-size="9.5" fill="#099268">目標は本人のもの（プレーヤーズセンタード）</text>
  <rect x="50" y="184" width="220" height="24" rx="6" fill="#ffffff" stroke="#099268"/>
  <text x="160" y="200" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">紙のノートを撮る</tspan> → 読み取り</text>
  <rect x="50" y="214" width="220" height="24" rx="6" fill="#ffffff" stroke="#099268"/>
  <text x="160" y="230" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">問いかけに答える</tspan>（オープン → 選択肢）</text>
  <rect x="50" y="244" width="220" height="24" rx="6" fill="#ffffff" stroke="#099268"/>
  <text x="160" y="260" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">次のテーマを選ぶ</tspan>・書きかえる</text>
  <rect x="50" y="274" width="220" height="24" rx="6" fill="#c3fae8" stroke="#099268"/>
  <text x="160" y="290" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">黒帯への道のり</tspan>・本人の目標</text>
  <rect x="50" y="306" width="220" height="26" rx="6" fill="none" stroke="#099268" stroke-dasharray="4 3"/>
  <text x="160" y="323" text-anchor="middle" font-size="9" fill="#099268">読み取りと問いかけは、その場で返す</text>
  <text x="160" y="352" text-anchor="middle" font-size="9" font-style="italic" fill="#087f5b">Claude は答えを教えない・出来を判定しない</text>

  <!-- 保護者 -->
  <rect x="310" y="130" width="260" height="238" rx="12" fill="#e8f1fc" stroke="#1c7ed6" stroke-width="1.5"/>
  <text x="440" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#1864ab">保護者</text>
  <text x="440" y="170" text-anchor="middle" font-size="9.5" fill="#1c7ed6">応援する側（アントラージュ）</text>
  <rect x="330" y="184" width="220" height="24" rx="6" fill="#ffffff" stroke="#1c7ed6"/>
  <text x="440" y="200" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">今週のお便り</tspan> — 先生のことば</text>
  <rect x="330" y="214" width="220" height="24" rx="6" fill="#ffffff" stroke="#1c7ed6"/>
  <text x="440" y="230" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">見てほしいところ</tspan>（1つ）</text>
  <rect x="330" y="244" width="220" height="24" rx="6" fill="#ffffff" stroke="#1c7ed6"/>
  <text x="440" y="260" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">声かけのヒント</tspan>・自主練・安全</text>
  <rect x="330" y="274" width="220" height="24" rx="6" fill="#d0ebff" stroke="#1c7ed6"/>
  <text x="440" y="290" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">手本と見比べる</tspan>（形の写真）</text>
  <rect x="330" y="306" width="220" height="26" rx="6" fill="none" stroke="#1c7ed6" stroke-dasharray="4 3"/>
  <text x="440" y="323" text-anchor="middle" font-size="9" fill="#1c7ed6">お便りは、先生が承認したものだけ</text>
  <text x="440" y="352" text-anchor="middle" font-size="9" font-style="italic" fill="#1864ab">採点や見張りの役はさせない</text>

  <!-- 先生 -->
  <rect x="590" y="130" width="260" height="238" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="720" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#d9480f">先生（指導者）</text>
  <text x="720" y="170" text-anchor="middle" font-size="9.5" fill="#e8590c">育成計画と知見を、稽古の外まで届ける</text>
  <rect x="610" y="184" width="220" height="24" rx="6" fill="#ffffff" stroke="#e8590c"/>
  <text x="720" y="200" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">1対1のことば</tspan> — その場で文字に</text>
  <rect x="610" y="214" width="220" height="24" rx="6" fill="#ffffff" stroke="#e8590c"/>
  <text x="720" y="230" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">到達基準のチェック</tspan>を付ける</text>
  <rect x="610" y="244" width="220" height="24" rx="6" fill="#ffffff" stroke="#e8590c"/>
  <text x="720" y="260" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">下書きを直して承認</tspan>する</text>
  <rect x="610" y="274" width="220" height="24" rx="6" fill="#ffe8cc" stroke="#e8590c"/>
  <text x="720" y="290" text-anchor="middle" font-size="10" fill="#212529"><tspan font-weight="bold">知見（skills/）</tspan>を書いて育てる</text>
  <rect x="610" y="306" width="220" height="26" rx="6" fill="none" stroke="#e8590c" stroke-dasharray="4 3"/>
  <text x="720" y="318" text-anchor="middle" font-size="8.5" fill="#e8590c">問いかけ方・安全な自主練・育成の考え方・</text>
  <text x="720" y="329" text-anchor="middle" font-size="8.5" fill="#e8590c">平安二段（到達基準つき）</text>
  <text x="720" y="352" text-anchor="middle" font-size="9" font-style="italic" fill="#d9480f">承認するまで、道場生・保護者には届かない</text>

  <!-- 矢印：3つの立場 → Claude -->
  <line x1="160" y1="368" x2="160" y2="422" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="440" y1="422" x2="440" y2="368" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="720" y1="368" x2="720" y2="422" stroke="#868e96" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="168" y="400" text-anchor="start" font-size="9" fill="#868e96">ノートの写真・答え</text>
  <text x="448" y="400" text-anchor="start" font-size="9" fill="#868e96">承認したお便りだけ</text>
  <text x="712" y="400" text-anchor="end" font-size="9" fill="#868e96">ことば・チェック・知見</text>

  <!-- Claude の6つの場面 -->
  <rect x="30" y="424" width="820" height="128" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
  <text x="440" y="448" text-anchor="middle" font-size="14" font-weight="bold" fill="#5f3dc4">Claude（Anthropic API）— 6つの場面で使い分け</text>

  <rect x="45" y="464" width="100" height="50" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="95" y="484" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#212529">① ノートの読み取り</text>
  <text x="95" y="500" text-anchor="middle" font-size="8" fill="#7048e8">Opus 5.5</text>
  <line x1="145" y1="489" x2="154" y2="489" stroke="#868e96" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="156" y="464" width="100" height="50" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="206" y="484" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#212529">② 1対1の整理</text>
  <text x="206" y="500" text-anchor="middle" font-size="8" fill="#7048e8">Haiku 5.5</text>
  <line x1="256" y1="489" x2="265" y2="489" stroke="#868e96" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="267" y="464" width="100" height="50" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="317" y="484" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#212529">③ 問いかけ</text>
  <text x="317" y="500" text-anchor="middle" font-size="8" fill="#7048e8">Sonnet 5.5</text>
  <line x1="367" y1="489" x2="376" y2="489" stroke="#868e96" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="378" y="464" width="100" height="50" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="428" y="484" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#212529">④ 下書き</text>
  <text x="428" y="500" text-anchor="middle" font-size="8" fill="#7048e8">Opus 5.5・先生あて</text>
  <line x1="478" y1="489" x2="487" y2="489" stroke="#868e96" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="489" y="464" width="100" height="50" rx="6" fill="#ffffff" stroke="#7048e8"/>
  <text x="539" y="484" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#212529">⑤ 点検</text>
  <text x="539" y="500" text-anchor="middle" font-size="8" fill="#7048e8">Opus 5.5・別の Claude</text>
  <line x1="589" y1="489" x2="598" y2="489" stroke="#868e96" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="600" y="464" width="122" height="50" rx="6" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="661" y="484" text-anchor="middle" font-size="10" font-weight="bold" fill="#d9480f">先生が直して承認</text>
  <text x="661" y="500" text-anchor="middle" font-size="8" fill="#e8590c">→ 保護者・道場生へ</text>

  <line x1="729" y1="460" x2="729" y2="518" stroke="#7048e8" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="736" y="464" width="100" height="50" rx="6" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
  <text x="786" y="484" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#212529">⑥ 形の見比べ</text>
  <text x="786" y="500" text-anchor="middle" font-size="8" fill="#1c7ed6">Opus 5.5・保護者へ</text>

  <text x="440" y="534" text-anchor="middle" font-size="9" fill="#5f3dc4">①③ は道場生にその場で返す（答えは教えない）。②④⑤ は先生あて。届ける項目は1か所で取り出し、テストで守る</text>
  <text x="440" y="546" text-anchor="middle" font-size="9" fill="#5f3dc4">⑥ は先生が書いた知見から「見比べるところ」を選ぶだけ（出来の判定はしない・写真は保存しない）</text>

  <!-- いちばん下 -->
  <rect x="30" y="568" width="820" height="44" rx="10" fill="none" stroke="#adb5bd" stroke-dasharray="5 4"/>
  <text x="440" y="594" text-anchor="middle" font-size="11" fill="#495057">Next.js（Vercel）・Postgres（Neon）／ API キーはサーバーだけ／ 1日の上限と保存済みのデモ応答／ データはすべて架空</text>
</svg>
