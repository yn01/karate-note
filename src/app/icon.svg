<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 空手ノートのアイコン：握った拳（手のひら側から。4本の指を握り、親指を上にかぶせる）。墨と和紙の色 -->
  <rect width="64" height="64" rx="14" fill="#f6f1e7"/>
  <!-- 手首 -->
  <rect x="17" y="46" width="22" height="13" rx="3" fill="#22252b"/>
  <!-- 手のひら -->
  <rect x="13" y="16" width="30" height="34" rx="8" fill="#22252b"/>
  <!-- 握った4本の指（横に並ぶ） -->
  <g fill="#22252b" stroke="#f6f1e7" stroke-width="2.4">
    <rect x="25" y="11" width="25" height="10" rx="5"/>
    <rect x="25" y="20" width="27" height="10" rx="5"/>
    <rect x="25" y="29" width="27" height="10" rx="5"/>
    <rect x="25" y="38" width="24" height="10" rx="5"/>
  </g>
  <!-- 親指（指の上にかぶせる） -->
  <rect x="11" y="23" width="29" height="10" rx="5" fill="#22252b" stroke="#f6f1e7" stroke-width="2.4" transform="rotate(-8 25 28)"/>
</svg>
